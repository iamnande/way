[package]
name = "way"
version = "0.1.0"
edition = "2024"

# PROTOTYPE — wipe me. Throwaway TUI-variants prototype for wayfinder ticket #21.
# Run with: cargo run --bin tui-prototype
[[bin]]
name = "tui-prototype"
path = "src/bin/tui_prototype.rs"

[[bin]]
name = "way"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
edtui = { version = "0.11.6", default-features = false }
notify = "8.2.0"
ratatui = "0.30.2"
redb = "4.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.0", features = ["v4"] }
